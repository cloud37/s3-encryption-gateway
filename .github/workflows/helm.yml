name: Release Helm Chart

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - 'helm/**'
      - '.github/workflows/helm.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'helm/**'
      - '.github/workflows/helm.yml'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Run helm lint
        run: |
          cd helm/s3-encryption-gateway
          helm lint .

      - name: Add Helm repos
        run: helm repo add valkey https://valkey.io/valkey-helm/

      - name: Build chart dependencies
        run: helm dependency build helm/s3-encryption-gateway

      - name: Run helm template
        run: |
          cd helm/s3-encryption-gateway
          helm template test-release .

  release:
    runs-on: ubuntu-latest
    needs: lint
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
      pages: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Add Helm repos
        run: helm repo add valkey https://valkey.io/valkey-helm/

      - name: Build chart dependencies
        run: helm dependency build helm/s3-encryption-gateway

      - name: Check if chart version already released
        id: version_check
        run: |
          CHART_VERSION=$(grep '^version:' helm/s3-encryption-gateway/Chart.yaml | awk '{print $2}')
          RELEASE_TAG="s3-encryption-gateway-${CHART_VERSION}"
          echo "chart_version=${CHART_VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          if gh release view "${RELEASE_TAG}" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            echo "Chart version ${CHART_VERSION} already released — skipping chart-releaser."
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
            echo "Chart version ${CHART_VERSION} is new — will release."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract changelog entry
        if: steps.version_check.outputs.already_released == 'false'
        run: |
          bash scripts/extract-changelog-section.sh \
            CHANGELOG.md \
            "${{ steps.version_check.outputs.chart_version }}" \
            > /tmp/release-notes.md

      - name: Log in to GHCR for Helm
        if: steps.version_check.outputs.already_released == 'false'
        run: |
          printf '%s' "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Package and publish OCI chart
        id: oci_chart
        if: steps.version_check.outputs.already_released == 'false'
        env:
          CHART_VERSION: ${{ steps.version_check.outputs.chart_version }}
        run: |
          set -euo pipefail
          OCI_DIR="${RUNNER_TEMP}/helm-oci"
          CHART_NAME=s3-encryption-gateway
          mkdir -p "${OCI_DIR}"
          helm package helm/s3-encryption-gateway --destination "${OCI_DIR}"
          ARCHIVE="${OCI_DIR}/${CHART_NAME}-${CHART_VERSION}.tgz"
          test -f "${ARCHIVE}"
          test "$(helm show chart "${ARCHIVE}" | awk -F': ' '$1 == "name" {print $2; exit}')" = "${CHART_NAME}"
          test "$(helm show chart "${ARCHIVE}" | awk -F': ' '$1 == "version" {print $2; exit}')" = "${CHART_VERSION}"
          PUSH_OUTPUT=$(mktemp)
          helm push "${ARCHIVE}" oci://ghcr.io/cloud37 2>&1 | tee "${PUSH_OUTPUT}"
          DIGEST=$(grep -Eo 'sha256:[0-9a-fA-F]{64}' "${PUSH_OUTPUT}" | tail -n1 || true)
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: helm push did not return a valid manifest digest" >&2
            exit 1
          fi
          CHART_REF="ghcr.io/cloud37/${CHART_NAME}@${DIGEST}"
          echo "chart_digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "chart_ref=${CHART_REF}" >> "$GITHUB_OUTPUT"
          echo "Published ${CHART_REF}"

      - name: Run chart-releaser
        if: steps.version_check.outputs.already_released == 'false'
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: helm
          config: .github/cr.yaml
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Update GitHub release notes
        if: steps.version_check.outputs.already_released == 'false'
        run: |
          {
            cat /tmp/release-notes.md
            printf '\nSee the [full changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).\n'
          } > /tmp/release-notes-with-link.md

          gh release edit "${{ steps.version_check.outputs.release_tag }}" \
            --notes-file /tmp/release-notes-with-link.md \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      # ── Mark pre-release versions explicitly on GitHub ──────────────────────
      - name: Mark release as pre-release if version contains a pre-release suffix
        if: steps.version_check.outputs.already_released == 'false' && contains(steps.version_check.outputs.chart_version, '-')
        run: |
          gh release edit "${{ steps.version_check.outputs.release_tag }}" \
            --prerelease \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Build and attach binaries to the same release ───────────────────────
      - name: Set up Go
        if: steps.version_check.outputs.already_released == 'false'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build binaries
        if: steps.version_check.outputs.already_released == 'false'
        id: build_binaries
        run: |
          CHART_VERSION="${{ steps.version_check.outputs.chart_version }}"
          mkdir -p bin
          # Gateway server
          GOOS=linux  GOARCH=amd64  CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${CHART_VERSION} -X main.commit=${{ github.sha }}" -o bin/s3-encryption-gateway-linux-amd64  ./cmd/server
          GOOS=linux  GOARCH=arm64  CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${CHART_VERSION} -X main.commit=${{ github.sha }}" -o bin/s3-encryption-gateway-linux-arm64  ./cmd/server
          GOOS=darwin GOARCH=arm64  CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${CHART_VERSION} -X main.commit=${{ github.sha }}" -o bin/s3-encryption-gateway-darwin-arm64 ./cmd/server
          # CLI audit tool (s3eg-cli)
          GOOS=linux  GOARCH=amd64  CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${CHART_VERSION} -X main.commit=${{ github.sha }}" -o bin/s3eg-cli-linux-amd64  ./cmd/cli
          GOOS=linux  GOARCH=arm64  CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${CHART_VERSION} -X main.commit=${{ github.sha }}" -o bin/s3eg-cli-linux-arm64  ./cmd/cli
          GOOS=darwin GOARCH=arm64  CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${CHART_VERSION} -X main.commit=${{ github.sha }}" -o bin/s3eg-cli-darwin-arm64 ./cmd/cli
          # Deprecated migration shim (prints deprecation notice)
          GOOS=linux  GOARCH=amd64  CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${CHART_VERSION} -X main.commit=${{ github.sha }}" -o bin/s3eg-migrate-linux-amd64  ./cmd/migrate
          GOOS=linux  GOARCH=arm64  CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${CHART_VERSION} -X main.commit=${{ github.sha }}" -o bin/s3eg-migrate-linux-arm64  ./cmd/migrate
          GOOS=darwin GOARCH=arm64  CGO_ENABLED=0 go build -ldflags="-w -s -X main.version=${CHART_VERSION} -X main.commit=${{ github.sha }}" -o bin/s3eg-migrate-darwin-arm64 ./cmd/migrate
          echo "binaries_built=true" >> "$GITHUB_OUTPUT"

      - name: Upload binaries to release
        if: steps.build_binaries.outputs.binaries_built == 'true' && steps.version_check.outputs.already_released == 'false'
        run: |
          RELEASE_TAG="${{ steps.version_check.outputs.release_tag }}"
          for f in bin/*; do
            echo "Uploading $f to release ${RELEASE_TAG}"
            gh release upload "${RELEASE_TAG}" "$f" --repo "${{ github.repository }}" --clobber
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Build and push multi-arch Docker images, SBOM, and cosign attestation ────
      - name: Set up QEMU
        if: steps.version_check.outputs.already_released == 'false'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.version_check.outputs.already_released == 'false'
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: steps.version_check.outputs.already_released == 'false'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: build_image
        if: steps.version_check.outputs.already_released == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            cloud37io/s3-encryption-gateway:${{ steps.version_check.outputs.chart_version }}
            cloud37io/s3-encryption-gateway:latest
          build-args: |
            VERSION=${{ steps.version_check.outputs.chart_version }}
            COMMIT=${{ github.sha }}

      - name: Build and push FIPS image (linux/amd64 only)
        id: build_fips_image
        if: steps.version_check.outputs.already_released == 'false'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.fips
          platforms: linux/amd64
          push: true
          tags: |
            cloud37io/s3-encryption-gateway:${{ steps.version_check.outputs.chart_version }}-fips
          build-args: |
            VERSION=${{ steps.version_check.outputs.chart_version }}
            COMMIT=${{ github.sha }}

      - name: Log in to Docker Hub (for Trivy pull)
        if: steps.version_check.outputs.already_released == 'false'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Trivy container scan
        if: steps.version_check.outputs.already_released == 'false'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud37io/s3-encryption-gateway:${{ steps.version_check.outputs.chart_version }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      - name: Generate SBOM
        if: steps.version_check.outputs.already_released == 'false'
        uses: anchore/sbom-action@v0
        with:
          image: cloud37io/s3-encryption-gateway:${{ steps.version_check.outputs.chart_version }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM to release
        if: steps.version_check.outputs.already_released == 'false'
        run: |
          gh release upload "${{ steps.version_check.outputs.release_tag }}" \
            sbom.spdx.json \
            --repo "${{ github.repository }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        if: steps.version_check.outputs.already_released == 'false'
        uses: sigstore/cosign-installer@v4.1.2

      - name: Log in to GHCR for OCI signing
        if: steps.version_check.outputs.already_released == 'false'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign and verify OCI chart with cosign
        if: steps.version_check.outputs.already_released == 'false'
        env:
          CHART_REF: ${{ steps.oci_chart.outputs.chart_ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "${CHART_REF}"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/cloud37/s3-encryption-gateway/\.github/workflows/helm\.yml@refs/heads/(main|master)$' \
            "${CHART_REF}"

      - name: Verify OCI chart metadata and summarize digest
        if: steps.version_check.outputs.already_released == 'false'
        env:
          CHART_VERSION: ${{ steps.version_check.outputs.chart_version }}
          CHART_DIGEST: ${{ steps.oci_chart.outputs.chart_digest }}
          CHART_REF: ${{ steps.oci_chart.outputs.chart_ref }}
        run: |
          set -euo pipefail
          OCI_REF=oci://ghcr.io/cloud37/s3-encryption-gateway
          OCI_DIR="${RUNNER_TEMP}/helm-oci-verify"
          mkdir -p "${OCI_DIR}"
          helm pull "${OCI_REF}@${CHART_DIGEST}" --destination "${OCI_DIR}"
          OCI_ARCHIVE=$(find "${OCI_DIR}" -maxdepth 1 -name 's3-encryption-gateway-*.tgz' -print -quit)
          test -f "${OCI_ARCHIVE}"
          metadata="${OCI_DIR}/oci-chart-metadata.yaml"
          helm show chart "${OCI_ARCHIVE}" > "${metadata}"
          test "$(awk -F': ' '$1 == "name" {print $2; exit}' "${metadata}")" = s3-encryption-gateway
          test "$(awk -F': ' '$1 == "version" {print $2; exit}' "${metadata}")" = "${CHART_VERSION}"
          {
            echo '### Signed OCI Helm chart'
            echo
            echo "- Digest-qualified reference: \`${CHART_REF}\`"
            echo "- Chart version: \`${CHART_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Sign and attest image with cosign (keyless OIDC)
        if: steps.version_check.outputs.already_released == 'false'
        run: |
          IMAGE_DIGEST="index.docker.io/cloud37io/s3-encryption-gateway@${{ steps.build_image.outputs.digest }}"
          cosign sign --yes "${IMAGE_DIGEST}"
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${IMAGE_DIGEST}"

      - name: Copy chart README to gh-pages
        if: steps.version_check.outputs.already_released == 'false'
        run: |
          git fetch origin gh-pages
          # Read the chart README from main before switching branches
          git show origin/main:helm/s3-encryption-gateway/README.md > /tmp/chart-readme.md
          git checkout gh-pages
          cp /tmp/chart-readme.md README.md
          git add README.md
          git diff --cached --quiet || git commit -m "docs: update chart README from main [skip ci]"
          git push origin gh-pages
