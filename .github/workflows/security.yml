# Security Scanning — govulncheck (vulnerability) + gosec (static analysis)
#
# Runs on every PR targeting main and every push to main.
#
# govulncheck: blocks any known CVE in direct or transitive Go dependencies.
# gosec:       blocks HIGH-severity findings and requires rule-specific,
#              explained suppressions. Lower-severity findings remain visible
#              in explicit all-severity audits; no rule is globally excluded.

name: Security Scanning

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security:
    name: Security scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -nosec-require-rules -nosec-require-justification -severity high ./...
