apiVersion: v2
name: s3-encryption-gateway
description: A Helm chart for S3 Encryption Gateway - a transparent proxy providing client-side encryption for S3-compatible storage services
keywords:
  - s3
  - encryption
  - gateway
  - storage
home: https://github.com/cloud37/s3-encryption-gateway
sources:
  - https://github.com/cloud37/s3-encryption-gateway
maintainers:
  - name: kenchrcum
    url: https://github.com/kenchrcum
type: application
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "false"
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/cloud37/s3-encryption-gateway
  artifacthub.io/images: |
    - name: s3-encryption-gateway
      image: docker.io/cloud37io/s3-encryption-gateway:0.12.3
      whitelisted: true
    - name: s3-encryption-gateway-fips
      image: docker.io/cloud37io/s3-encryption-gateway:0.12.3-fips
      whitelisted: true
  artifacthub.io/changes: |
    - kind: fixed
      description: Preserve backend S3 errors during encrypted object-read preflight without false decrypt or tamper alerts (GH-344)
    - kind: fixed
      description: Honor signed presigned URL lifetimes independently of the header-auth clock-skew window and validate bounded expiry values (GH-345)
    - kind: fixed
      description: Decode CopyObject and UploadPartCopy source identities exactly once and encode backend-native copy headers (GH-346)
    - kind: changed
      description: Update OpenTelemetry, OpenBao, backoff, Moby API, generated Google API modules, and compatibility client and KMS images
    - kind: changed
      description: Expand signed-handler, wire, fuzz, and four-provider regressions and document deployment guidance and corrected Garage versioning capabilities
  artifacthub.io/containsSecurityUpdates: "false"
version: 0.12.3
appVersion: "0.12.3"
dependencies:
  # Valkey subchart for encrypted multipart upload state (V0.6-SEC-3 / ADR-0009).
  # Enabled when `encryptMultipartUploads` is set on any bucket policy;
  # otherwise leave disabled. Uses the community Valkey chart at
  # https://valkey.io/valkey-helm/ (package `valkey/valkey` on Artifact Hub).
  # Chosen over Bitnami because Bitnami's catalog moved to a commercial
  # license model; this chart is Apache-2.0 + verified publisher.
  - name: valkey
    version: "~0.12.0"
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled
