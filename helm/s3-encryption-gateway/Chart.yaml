apiVersion: v2
name: s3-encryption-gateway
description: A Helm chart for S3 Encryption Gateway - a transparent proxy providing client-side encryption for S3-compatible storage services
keywords:
  - s3
  - encryption
  - gateway
  - storage
home: https://github.com/cloud37/s3-encryption-gateway
sources:
  - https://github.com/cloud37/s3-encryption-gateway
maintainers:
  - name: kenchrcum
    url: https://github.com/kenchrcum
type: application
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: MIT
  artifacthub.io/prerelease: "false"
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/cloud37/s3-encryption-gateway
  artifacthub.io/images: |
    - name: s3-encryption-gateway
      image: docker.io/cloud37io/s3-encryption-gateway:0.12.2
      whitelisted: true
    - name: s3-encryption-gateway-fips
      image: docker.io/cloud37io/s3-encryption-gateway:0.12.2-fips
      whitelisted: true
  artifacthub.io/changes: |
    - kind: fixed
      description: Publish complete bucket-policy snapshots atomically on reload to prevent encrypted writes to bypass buckets
    - kind: fixed
      description: Sanitize passthrough request and response headers for reliable backend signing behind reverse proxies
    - kind: fixed
      description: Preserve standard and user metadata, plaintext sizes, and fresh cached bodies across object and multipart operations
    - kind: fixed
      description: Retain validated plaintext range bounds for encrypted multipart UploadPartCopy
    - kind: security
      description: Validate crypto and multipart numeric bounds and manifests before cipher use or backend mutation
    - kind: security
      description: Verify configured KMS CA chains, reject unsafe audit destinations, and isolate backend redirects
    - kind: changed
      description: Centralize object metadata handling and enforce COPY and REPLACE directives and gateway-reserved metadata validation
    - kind: changed
      description: Expand provider-neutral regression coverage, enforce explained gosec suppressions, and update compatibility fixtures
  artifacthub.io/containsSecurityUpdates: "true"
version: 0.12.2
appVersion: "0.12.2"
dependencies:
  # Valkey subchart for encrypted multipart upload state (V0.6-SEC-3 / ADR-0009).
  # Enabled when `encryptMultipartUploads` is set on any bucket policy;
  # otherwise leave disabled. Uses the community Valkey chart at
  # https://valkey.io/valkey-helm/ (package `valkey/valkey` on Artifact Hub).
  # Chosen over Bitnami because Bitnami's catalog moved to a commercial
  # license model; this chart is Apache-2.0 + verified publisher.
  - name: valkey
    version: "~0.12.0"
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled
