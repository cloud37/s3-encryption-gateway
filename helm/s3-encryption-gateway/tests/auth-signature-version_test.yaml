templates:
  - deployment.yaml
release:
  name: s3eg-auth-version
  namespace: default
values:
  - ../values.yaml
tests:
  - it: should default ALLOW_BUCKET_CREATION to false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALLOW_BUCKET_CREATION
            value: "false"
  - it: should render ALLOW_BUCKET_CREATION when enabled
    set:
      config.allowBucketCreation.value: "true"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: ALLOW_BUCKET_CREATION
            value: "true"
  - it: should render explicit bucket management permissions
    set:
      config.auth.credentials:
        - accessKey: { value: "management" }
          secretKey: { value: "secret" }
          bucketPermissions: [create, delete]
      config.encryption.password.value: "test-password"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: GW_CRED_0_BUCKET_PERMISSIONS
            value: "create,delete"
  - it: should not infer bucket permissions from rw
    set:
      config.auth.credentials:
        - accessKey: { value: "management" }
          secretKey: { value: "secret" }
          permissions: "rw"
      config.encryption.password.value: "test-password"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: GW_CRED_0_BUCKET_PERMISSIONS
  - it: should disable legacy SigV2 by default
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_ALLOW_LEGACY_SIGNATURE_V2
            value: "false"
  - it: should enable legacy SigV2 when explicitly requested
    set:
      config.auth.allowLegacySignatureV2.value: "true"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_ALLOW_LEGACY_SIGNATURE_V2
            value: "true"
  - it: should render AUTH_ALLOW_LEGACY_SIGNATURE_V2 from valueFrom
    set:
      config.auth.allowLegacySignatureV2.value: ""
      config.auth.allowLegacySignatureV2.valueFrom.secretKeyRef.name: legacy-auth
      config.auth.allowLegacySignatureV2.valueFrom.secretKeyRef.key: enabled
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: AUTH_ALLOW_LEGACY_SIGNATURE_V2
            valueFrom:
              secretKeyRef:
                name: legacy-auth
                key: enabled
