templates:
  - deployment.yaml
release:
  name: s3eg-test
  namespace: default
values:
  - ../values.yaml
tests:
  - it: prevents old and replacement writers overlapping for a single-replica rollout
    asserts:
      - equal:
          path: spec.strategy.type
          value: RollingUpdate
      - equal:
          path: spec.strategy.rollingUpdate.maxSurge
          value: 0
      - equal:
          path: spec.strategy.rollingUpdate.maxUnavailable
          value: 1
  - it: enables the state-v2 writer when configured
    set:
      config.multipartState.valkey.stateV2Writer.enabled.value: "true"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_MPU_STATE_V2_WRITER
            value: "true"
  - it: omits the state-v2 writer opt-in by default
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_MPU_STATE_V2_WRITER
  - it: omits the state-v2 writer when explicitly disabled
    set:
      config.multipartState.valkey.stateV2Writer.enabled.value: "false"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_MPU_STATE_V2_WRITER
  - it: omits the state-v2 writer for unsupported truthy values
    set:
      config.multipartState.valkey.stateV2Writer.enabled.value: "1"
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: VALKEY_MPU_STATE_V2_WRITER
