suite: auth-credentials

tests:
  - it: should render GW_CRED env vars for each credential
    template: templates/deployment.yaml
    set:
      config.auth.credentials:
        - accessKey: { value: "cred-access-key" }
          secretKey: { value: "cred-secret-key" }
          label: "test"
      config.encryption.password.value: "test-password"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: GW_CRED_0_ACCESS_KEY, value: "cred-access-key" }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: GW_CRED_0_SECRET_KEY, value: "cred-secret-key" }

  - it: should render credential bucket scope and permissions
    template: templates/deployment.yaml
    set:
      config.auth.credentials:
        - accessKey: { value: "scoped" }
          secretKey: { value: "secret" }
          label: "tenant-a-label"
          buckets: ["tenant-a", "shared-*"]
          permissions: ro
          bucketPermissions: [delete]
      config.encryption.password.value: "test-password"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: GW_CRED_0_BUCKETS, value: "tenant-a,shared-*" }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: GW_CRED_0_PERMISSIONS, value: "ro" }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: GW_CRED_0_BUCKET_PERMISSIONS, value: "delete" }
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: GW_CRED_0_LABEL, value: "tenant-a-label" }

  - it: should omit GW_CRED buckets when scope is omitted
    template: templates/deployment.yaml
    set:
      config.auth.credentials:
        - accessKey: { value: "scoped" }
          secretKey: { value: "secret" }
      config.encryption.password.value: "test-password"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: GW_CRED_0_ACCESS_KEY, value: "scoped" }
      - notContains:
          path: spec.template.spec.containers[0].env
          content: { name: GW_CRED_0_BUCKETS }

  - it: should render empty GW_CRED buckets for deny-all
    template: templates/deployment.yaml
    set:
      config.auth.credentials:
        - accessKey: { value: "deny" }
          secretKey: { value: "secret" }
          buckets: []
      config.encryption.password.value: "test-password"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: { name: GW_CRED_0_BUCKETS, value: "" }
